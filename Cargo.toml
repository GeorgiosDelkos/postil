[package]
name = "postil"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/GeorgiosDelkos/postil"
description = "Read a repository, write review notes on lines, and send them to a coding agent."

# Every dependency here was counted and chosen in docs/design.md, "Dependencies". A new one
# needs the same justification: the goal is a small tree.
[dependencies]
# The system webview (WKWebView on macOS) that draws the page. `os-webview` is the webview
# itself and is required on every platform.
wry = { version = "0.57.3", default-features = false, features = ["os-webview"] }
# The window and event loop the webview lives in. `rwh_06` is the window-handle version wry
# builds against.
tao = { version = "0.37.3", default-features = false, features = ["rwh_06"] }
# JSON for the page: the file list and the highlighted lines.
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
# Syntax colors. One grammar crate per language.
tree-sitter-highlight = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-bash = "0.25.1"

# The native Open Folder dialog (NSOpenPanel). wry and tao already build these three crates,
# at these versions and with these features, so depending on them adds no crate. Their
# default features bind all of Foundation and AppKit, hence the explicit lists.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSWindow",
] }
# The menu bar (Tauri's menu crate, made for tao). It adds 13 crates (119 to 132), measured
# 2026-11-22. The alternative, NSMenu through objc2-app-kit, needs an Objective-C class for the
# menu's actions, which takes `unsafe`; the crate denies it outside `src/clone.rs`, which the
# owner allowed for clonefile(2) alone (2026-11-24). The default feature is GTK
# for Linux, which the app does not build for yet.
muda = { version = "0.21.2", default-features = false }

[profile.release]
# The binary ships to laptops: favor size and start time over build time.
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[package.metadata.house-check]
baseline = true

[lints.rust]
# Unsafe code only in `src/clone.rs`, which calls clonefile(2) and says so with an `expect`.
# The owner allowed that one module on 2026-11-24: a folder clone takes 3 s where the safe
# route, `cp -c -R`, takes 34 s (docs/design.md, "Worktrees").
unsafe_code = "deny"
# [ref] The rustc baseline: Tokio sets all five; Jon's crates and Cranelift set subsets
# (missing_docs in nearly every library of all three).
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
# [ref] Tokio denies it at the crate root: an ignored future or guard is always a bug.
unused_must_use = "deny"
# [ref] Cranelift's allow-by-default additions.
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
# [ref] Edition 2024 default; pinned so 2021 crates get it too.
static_mut_refs = "deny"
# [ref] Declare every custom cfg, so a typo in a cfg name warns. Add the crate's own
# (`<crate>_unstable`, CI-only cfgs) to this list.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(fuzzing)', 'cfg(coverage_nightly)'] }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[lints.clippy]
# [house] Stricter than every reference: pedantic catches real defects, and agents do not
# tire of fixing nits.
pedantic = { level = "warn", priority = -1 }

# Panics (PAN-*). `expect("<invariant>")` where an invariant guarantees success; tests may
# unwrap (clippy.toml).
unwrap_used = "warn"

# Lint suppressions (LNT-1): `#[expect(lint, reason = "...")]`, so a stale suppression fails.
allow_attributes_without_reason = "deny"
allow_attributes = "warn"

# Hygiene
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Libraries never print. A CLI prints from `main` or its one output function, with
# `println!`/`eprintln!` under a reasoned #[expect] on that function (LOG-3).
print_stdout = "deny"
print_stderr = "deny"

# Structure and style
use_self = "warn"
mod_module_files = "warn"
uninlined_format_args = "warn"
# [house] Arc::clone(&x) makes reference-count clones visible (API-12).
clone_on_ref_ptr = "warn"
# [ref: APIG C-STRUCT-PRIVATE] A struct is all-public passive data or all-private.
partial_pub_fields = "warn"
# Ignoring a #[must_use] value needs `drop(..)` or a binding that says why.
let_underscore_must_use = "warn"

# Unsafe (UNS-*). Every block has a `// SAFETY:` comment; every unsafe fn a `# Safety`
# section; one unsafe operation per block so each gets its own argument.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "warn"

# Concurrency and async
await_holding_lock = "deny"
large_futures = "deny"
mem_forget = "deny"

# Pedantic relaxations: noisy without catching bugs.
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
# Pushing a format! onto a String is clear; the lint's rewrite (write! plus an ignored
# fmt::Result, or iterator gymnastics) is not.
format_push_string = "allow"
# Fires on every invariant `expect` (PAN-3), which cannot panic while the invariant holds, so
# it buys `# Panics: never` boilerplate. Misuse panics get a `# Panics` section by PAN-2,
# checked in review.
missing_panics_doc = "allow"
