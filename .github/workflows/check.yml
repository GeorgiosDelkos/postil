# Derived from rust-style/templates/ci/check.yml (jonhoo/rust-ci-conf @ de512da1e85b with house
# additions), adapted for an application that ships on macOS only:
# - fmt: rustfmt; needs no build, so it runs on Linux.
# - clippy: no warnings, blocking. On macOS, because wry builds against GTK on Linux. Then
#   rustdoc, warnings denied, in the same job so it reuses the build: Cargo.toml denies broken
#   intra-doc links, and clippy does not run rustdoc, so without it a broken link merges green.
# - page: oxlint and oxfmt over the page's JavaScript in ui/ (house addition).
# Dropped from the template: semver and msrv (libraries only), hack (no features), and the
# beta clippy run: rust-toolchain.toml pins the toolchain, which would override the matrix.
# A draft PR gets no CI (gh-actions-style): every job carries the draft condition and no job has
# `needs:`, so a skipped run's green is replaced as soon as the PR is marked ready.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true
name: check
jobs:
  fmt:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    name: fmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain and components that rust-toolchain.toml names.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: cargo fmt --check
        run: cargo fmt --check
  clippy:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-latest
    name: clippy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features
        env:
          # Fails the build on any warning without touching RUSTFLAGS, so the build cache stays
          # shared with other cargo invocations.
          CARGO_BUILD_WARNINGS: deny
      - name: cargo doc
        run: cargo doc --no-deps --locked --all-features
        env:
          RUSTDOCFLAGS: -D warnings
  # The page's JavaScript (ui/), linted and format-checked. The page has no package.json by
  # design (docs/review-2026-11-23.md, D5): npx fetches each tool at an exact version, and
  # .oxlintrc.json and .oxfmtrc.json hold their settings. Node is the version test.yml pins.
  page:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    name: page / lint and format
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # tag=v7.1.0
        with:
          node-version: "26.13.0"
      - name: oxlint
        run: npx --yes oxlint@1.93.0 --deny-warnings ui/
      - name: oxfmt --check
        run: npx --yes oxfmt@0.78.0 --check 'ui/**/*.js'
