# From rust-style/templates/ci/deny.yml. Runs `cargo deny check` (advisories, licenses, bans,
# sources) whenever a change touches the dependency graph or the policy, and daily so a new
# advisory surfaces without a PR. deny.toml limits the graph to macOS targets, so Linux runs it.
# Blocking: never continue-on-error.
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/deny.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/deny.yml"
  schedule:
    - cron: '0 2 * * *'
# See check.yml for information about how the concurrency cancellation and workflow triggering works
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true
name: deny
jobs:
  deny:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    name: cargo deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      # cargo deny runs `cargo metadata`, which uses the toolchain rust-toolchain.toml pins.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: cargo install cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # tag=v2.90.5
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny --locked check
