# Builds, signs, notarizes and publishes Postil.app from a version tag `v*`, after the pattern of
# GeorgiosDelkos/vigil's release workflow, with the same secret names, so one Developer ID and
# App Store Connect key serve both apps.
#
# One macOS job: scripts/bundle.sh builds the app (Apple Silicon; the runner's architecture),
# scripts/sign.sh signs it with the hardened runtime, notarizes and staples it, and the job checks
# that Gatekeeper sees a notarized Developer ID app of this team before it uploads a zip of it to
# a draft release, which it publishes last.
#
# workflow_dispatch is the dry run: the same build, signing, notarization and checks, and no
# release.
#
# Secrets live only in the GitHub Environment `release` (required reviewer: the owner; deployment
# policy: branch main and tags v*), never at repository level, and each reaches only the steps
# that use it:
#
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  its password
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   APPLE_TEAM_ID               the 10-character team id
#   APPLE_API_ISSUER            App Store Connect issuer id, for notarytool
#   APPLE_API_KEY               App Store Connect key id (not the .p8 itself)
#   APPLE_API_KEY_P8            the AuthKey_<id>.p8 text
name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: read
# One release at a time per ref; a second run waits rather than cancel one that is uploading.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: macos / release
    # macOS 15 ships /usr/bin/trash, which the scripts use instead of rm -rf.
    runs-on: macos-15
    environment: release
    permissions:
      contents: write # creates the draft release, uploads to it and publishes it
    timeout-minutes: 90
    env:
      # The tag to release, or empty on a dry run.
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
      APP: target/release/Postil.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Require the signing secrets (fail-closed)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Environment 'release' lacks these secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Check that the tag is the app's version
        if: env.RELEASE_TAG != ''
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "postil") | .version')"
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "::error::tag ${RELEASE_TAG} is not the app's version v${version}"
            exit 1
          fi

      # A keychain of this run's own holds the certificate and the notary profile, so nothing
      # lands in the runner's login keychain; the last step deletes it.
      - name: Import the certificate and the notary key into a keychain of this run
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/release.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          umask 077
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" -k "${keychain}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          rm "${RUNNER_TEMP}/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain}" > /dev/null
          # codesign finds the identity only in a keychain on the search list.
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086 # the existing keychains are one word each, by design
          security list-keychains -d user -s "${keychain}" ${existing}
          key="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "${APPLE_API_KEY_P8}" > "${key}"
          xcrun notarytool store-credentials postil --key "${key}" --key-id "${APPLE_API_KEY}" \
            --issuer "${APPLE_API_ISSUER}" --keychain "${keychain}"
          rm "${key}"
          echo "POSTIL_NOTARY_KEYCHAIN=${keychain}" >> "${GITHUB_ENV}"

      - name: Build the app bundle
        run: scripts/bundle.sh

      - name: Sign, notarize and staple
        env:
          POSTIL_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          POSTIL_NOTARY_PROFILE: postil
        run: scripts/sign.sh

      # Proves the app is signed with a Developer ID of this team, with the hardened runtime,
      # and seen by Gatekeeper as notarized, before anything is public.
      - name: Verify the signed app (fail-closed)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 "${APP}"
          codesign --display --verbose=2 "${APP}" 2> signature.txt
          cat signature.txt
          grep -q '^Authority=Developer ID Application: ' signature.txt \
            || { echo "::error::the app is not signed with a Developer ID Application certificate"; exit 1; }
          grep -Fqx "TeamIdentifier=${APPLE_TEAM_ID}" signature.txt \
            || { echo "::error::the app is not signed by team APPLE_TEAM_ID"; exit 1; }
          grep -q '^CodeDirectory .*flags=.*runtime' signature.txt \
            || { echo "::error::the app is not signed with the hardened runtime"; exit 1; }
          spctl --assess --type exec --verbose=2 "${APP}" 2>&1 | tee gatekeeper.txt
          grep -q 'source=Notarized Developer ID' gatekeeper.txt \
            || { echo "::error::Gatekeeper does not see the app as notarized"; exit 1; }
          xcrun stapler validate "${APP}"

      # A zip made by ditto keeps the bundle's signature and stapled ticket. The release is a
      # draft until the zip is on it, then published, so no one downloads a half-made release.
      - name: Publish the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          zip="Postil-${RELEASE_TAG}-macos-arm64.zip"
          ditto -c -k --keepParent "${APP}" "${zip}"
          gh release create "${RELEASE_TAG}" "${zip}" --repo "${GITHUB_REPOSITORY}" \
            --draft --title "Postil ${RELEASE_TAG}" \
            --notes "Unzip, and move Postil to Applications. For Apple Silicon Macs; signed and notarized."
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Delete the keychain of this run
        if: always()
        run: |
          if [ -n "${POSTIL_NOTARY_KEYCHAIN:-}" ]; then
            security delete-keychain "${POSTIL_NOTARY_KEYCHAIN}"
          fi
