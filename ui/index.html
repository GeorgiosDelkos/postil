<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Postil</title>
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>

<nav class="sidebar" aria-label="Files">
  <div class="drag-strip" data-drag></div>
  <div class="repo" data-drag>
    <button type="button" class="repo-name" id="repo-name" title="Switch project (⇧⌘O)"></button>
    <div class="repo-branch" id="repo-branch"></div>
    <div class="repo-warning" id="repo-warning" hidden></div>
  </div>
  <div class="filter">
    <label class="visually-hidden" for="filter">Find file</label>
    <input class="field" id="filter" type="text" placeholder="Find file" autocomplete="off" spellcheck="false">
  </div>
  <div class="files" id="files"></div>
  <div class="sidebar-footer">
    <button type="button" class="agent-status" id="agent-status" title="Show the run" hidden></button>
    <button type="button" class="settings-button usage-button" id="open-usage" title="Usage (⇧⌘U)">
      <svg class="settings-glyph" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3.5 12.5V8.5M8 12.5V4M12.5 12.5V6.5"/>
      </svg>
      <span>Usage</span>
      <span class="usage-warn-dot" id="usage-warn-dot" hidden></span>
      <kbd>⇧⌘U</kbd>
    </button>
    <button type="button" class="settings-button" id="open-settings" title="Settings (⌘,)">
      <svg class="settings-glyph" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M2 4.5h6M12 4.5h2M2 8h1.5M7.5 8H14M2 11.5h8M14 11.5h0"/>
        <circle cx="10" cy="4.5" r="1.75"/>
        <circle cx="5.5" cy="8" r="1.75"/>
        <circle cx="12" cy="11.5" r="1.75"/>
      </svg>
      <span>Settings</span>
      <kbd>⌘,</kbd>
    </button>
  </div>
</nav>

<main class="pane code-pane">
  <header class="pane-header" data-drag>
    <div class="crumbs" id="crumbs"></div>
    <div class="meta" id="file-meta"></div>
  </header>
  <div class="code" id="code" tabindex="0">
    <div class="code-rows" id="code-rows"></div>
    <div class="empty" id="code-empty">Pick a file on the left.</div>
  </div>
  <div class="prompt-preview" id="prompt-preview" tabindex="0" hidden></div>
  <div class="changes-view" id="changes-view" tabindex="0" hidden></div>
  <button type="button" class="focus-pill" id="focus-pill"></button>
</main>

<aside class="pane tray" id="tray" aria-label="Review">
  <header class="pane-header" data-drag>
    <div class="tray-tabs" role="tablist" aria-label="Tray">
      <button type="button" role="tab" class="tray-tab" id="tab-notes" aria-selected="true" aria-controls="notes">Review</button>
      <button type="button" role="tab" class="tray-tab" id="tab-run" aria-selected="false" aria-controls="run" hidden>Run</button>
    </div>
    <div class="meta" id="note-count">0 notes</div>
    <div class="run-header" id="run-header" hidden></div>
  </header>
  <div class="notes" id="notes" role="tabpanel" aria-labelledby="tab-notes">
    <div class="empty">Select lines, then press <kbd>c</kbd> to write a note.</div>
  </div>
  <div class="run" id="run" role="tabpanel" aria-labelledby="tab-run" hidden></div>
  <footer class="send-bar" id="send-bar" hidden>
    <button type="button" class="button primary send" id="send-button"></button>
    <button type="button" class="button primary agent-picker" id="agent-picker" aria-haspopup="menu" aria-label="Choose the agent"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 6.5 5 3.5 8 6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</aside>

<div class="divider" id="divider-files" role="separator" aria-orientation="vertical" aria-label="File list width" aria-controls="files" tabindex="0" title="Drag to resize · double-click to reset"></div>
<div class="divider" id="divider-tray" role="separator" aria-orientation="vertical" aria-label="Tray width" aria-controls="tray" tabindex="0" title="Drag to resize · double-click to reset"></div>

<section class="welcome" id="welcome" aria-labelledby="welcome-title" hidden>
  <div class="drag-strip" data-drag></div>
  <div class="welcome-body">
    <h1 class="welcome-title" id="welcome-title">Postil</h1>
    <p class="welcome-tagline">Read a repository, write notes on its lines, send them to an agent.</p>
    <div class="welcome-actions">
      <button type="button" class="button primary" id="open-folder">Open Folder… <kbd>⌘O</kbd></button>
      <button type="button" class="button" id="welcome-back" hidden></button>
    </div>
    <p class="welcome-hint">or drop a folder on this window</p>
    <div class="welcome-error" id="welcome-error" role="alert" hidden>
      <p class="welcome-error-text" id="welcome-error-text"></p>
      <button type="button" class="button" id="welcome-error-action" hidden></button>
    </div>
    <h2 class="welcome-heading">Recent</h2>
    <div class="recent" id="recent"></div>
  </div>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<dialog class="note-dialog" id="note-dialog" aria-labelledby="note-dialog-title"></dialog>
<dialog class="note-dialog path-note" id="path-note-dialog" aria-labelledby="path-note-title"></dialog>
<dialog class="note-dialog run-detail" id="run-detail" aria-labelledby="run-detail-title" tabindex="-1"></dialog>
<dialog class="settings" id="settings" aria-labelledby="settings-title" tabindex="-1"></dialog>
<dialog class="settings usage-dialog" id="usage" aria-labelledby="usage-title" tabindex="-1"></dialog>

<div class="context-menu" id="context-menu" role="menu" aria-label="Actions" tabindex="-1" hidden></div>

<template id="composer-template">
  <div class="composer">
    <label class="composer-label" for="note-body"></label>
    <textarea id="note-body" rows="2" spellcheck="true"></textarea>
    <div class="composer-actions">
      <span class="hint">⌘↵ save · esc discard</span>
      <div class="buttons">
        <button type="button" class="button" data-action="discard">Discard</button>
        <button type="button" class="button primary" data-action="save">Save note</button>
      </div>
    </div>
  </div>
</template>

</body>
</html>
