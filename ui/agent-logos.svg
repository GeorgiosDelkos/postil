<svg xmlns="http://www.w3.org/2000/svg">
<!-- The built-in agents' logos, one symbol each, drawn beside the agent's name (agentLogo in
     ui/icons.js). Each is the vendor's own file, from the vendor's own site, with nothing
     changed but what the page needs: the root's size, clip and mask wrappers and any
     construction lines are dropped, the viewBox is cropped to the mark, and a one-colour mark
     fills with currentColor, so it takes the text colour of Graphite and Paper as the vendor's
     dark and light files do. A coloured mark keeps its colours. ui/icons.test.js keeps this
     file to symbols of plain paths.

     Claude, Codex, Gemini and Grok are bundled by the owner's decision of 2026-11-26, knowing
     that their vendors' terms, as found that day and quoted below, ask for permission or a
     partner account first, or could not be read.

     agent-claude: the Claude Spark, "Claude Spark - Clay.svg" (#D97757) in Anthropic's press
     kit, https://www.anthropic.com/press-kit (a zip), retrieved 2026-11-26. Terms: Anthropic's
     Trademark Guidelines (effective 2024-08-01,
     https://assets.claude.com/f7874b435aabdaee5f836e888b4439b9b56a934b.pdf) allow its marks
     "only in materials we approve beforehand" and permit no change of colour or proportion.

     agent-codex: OpenAI's Blossom, the filled mark of "Blossom_Light.svg" linked from
     https://openai.com/brand (served from images.ctfassets.net, the CDN that page uses), its
     construction grid dropped, retrieved 2026-11-26. Codex has no mark of its own. Terms on
     that page: use the logo only when it relates to OpenAI services, exactly as provided, and
     acknowledge that it belongs to OpenAI; its Don't list includes "Use the logo without
     permission or outside OpenAI's terms" and adding colours to the Blossom.

     agent-gemini: Google Antigravity's icon (Postil runs Gemini through Antigravity's agy),
     "Icon - One Color" on https://antigravity.google/press, file
     https://antigravity.google/assets/image/brand/antigravity-icon__one-color.svg (#202124),
     retrieved 2026-11-26. Not the Gemini mark: the only Gemini mark a Google domain serves
     publicly (https://www.gstatic.com/lamda/images/gemini_sparkle_aurora_33f86dc0c0257da337c63.svg,
     from gemini.google.com) takes its colours from an embedded raster image, and Google's brand
     assets otherwise need a Partner Marketing Hub account. The full-colour Antigravity icon
     draws with blurred shapes (SVG filters), which this file does not carry, so the one-colour
     icon is used. The press page states no usage terms.

     agent-opencode: OpenCode's logo mark, "Default logo variant" on https://opencode.ai/brand,
     files https://opencode.ai/brand/files/opencode-logo-transparent-light.svg (#1F1F1F, inner
     square at 20% opacity) and opencode-logo-transparent-dark.svg (#EEEEEE, 28%), retrieved
     2026-11-26. The inner square's opacity per theme is the palette variable agent-logo-faint in
     ui/app.css. Terms on that page: "OpenCode and the OpenCode logo are trademarks of
     Anomaly"; use the light version on light backgrounds and the dark on dark; do not recolour
     it in new colours; do not use it to suggest that Anomaly endorses or sponsors you.

     agent-grok: Grok's mark, the two filled paths of https://grok.com/images/favicon.svg (the
     icon grok.com links), retrieved 2026-11-26. The file draws the mark in #FCFCFC on a dark
     rounded tile with a blur and a drop shadow; the tile, its effects and the mark's thin masked
     outline are dropped, and the mark fills with currentColor. Bundled by the owner's decision
     of 2026-11-26. Terms not read: https://x.ai/legal/brand-guidelines and the logo kit on
     data.x.ai refuse any client but a browser (HTTP 403). -->
